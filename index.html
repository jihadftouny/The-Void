<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>The Void</title>
    <style>
      :root {
        /* Safe-area insets exposed as CSS vars for any DOM overlay to consume. */
        --safe-top: env(safe-area-inset-top);
        --safe-right: env(safe-area-inset-right);
        --safe-bottom: env(safe-area-inset-bottom);
        --safe-left: env(safe-area-inset-left);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0c;
        overflow: hidden;
        /* Prevent iOS auto-zoom / callout weirdness on the input overlay. */
        -webkit-text-size-adjust: 100%;
      }
      canvas {
        display: block;
      }
      /* The temporary name-entry <input> overlay positioned over the canvas by
         src/render/ui/textInput.ts. Position/size are set inline (absolute, in px);
         this rule only styles it to match the terminal theme and stay tappable. */
      .void-input {
        position: absolute;
        z-index: 10;
        box-sizing: border-box;
        margin: 0;
        padding: 0 12px;
        min-height: 44px; /* touch-target floor even if the mapped rect is small */
        border: 2px solid #46465a;
        border-radius: 10px;
        background: #14141a;
        color: #e2e2e8;
        caret-color: #7aa2f7;
        font-family: monospace;
        font-size: 16px; /* >=16px stops iOS from zooming the page on focus */
        outline: none;
      }
      .void-input::placeholder {
        color: #787884;
      }
      .void-input:focus {
        border-color: #7aa2f7;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
