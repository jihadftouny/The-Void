<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>The Void</title>
    <link rel="stylesheet" href="/src/desktop/game.css" />
  </head>
  <body>
    <!-- THE ATMOSPHERE. One element, painted entirely by CSS from the `data-texture` and
         `--void-texture-*` values `theme.ts` writes for the current floor — fog, static,
         ash, glow or the True Void's vignette. It sits behind everything, takes no clicks,
         and says nothing to a screen reader. Reduced motion and high contrast both turn it
         off; the contrast gate in tokens.test.ts measures body ink against the surface it
         actually produces, not against the bare ground. -->
    <div id="atmosphere" class="void-texture" aria-hidden="true"></div>
    <main id="game">
      <aside id="sheet"></aside>
      <section id="stage">
        <!-- The persistent header band (UI-DESIGN.md §11 / FINDINGS.md S4a). Left: the floor
             tag, always visible, naming where you are IN WORDS — the accent may never be the
             only carrier of any state, so a colourblind player and a screen reader both get
             the floor here. Right: the model status line, demoted to quiet furniture. -->
        <header class="chrome">
          <span id="floor" class="floor-tag"></span>
          <p id="status" class="status">starting…</p>
        </header>
        <!-- THE STAGE BODY: two columns, and the split is the whole point of this element.
             The choices used to live INSIDE the reading column, so a six-row hub menu and a
             16:9 art frame competed with the prose for the same vertical space — and won,
             because both scroll panes collapse to nothing while a non-scrolling sibling
             keeps its full height. Measured before the fix: the narration got 0 px at the
             960x640 minimum and 4.5 px at the default window, and Abandon sat at y 664-713
             in a 640 px window. `src/dev/layoutProbe.test.ts` measures all of it for real. -->
        <div id="stage-body" class="stage-body">
          <!-- THE BATTLE FRAME'S TWO REGIONS (PLAN.md #6, UI-DESIGN.md §1), empty and hidden on
               every screen but a live fight. The ARENA is the centre stage: the enemy's framed
               3:4 region, its name, bar and chips, and the ticker with its Record toggle. The
               VITALS are the stat box that stands bottom-left in the fight. In the DOM they
               come first, so the keyboard reaches the ticker's toggle, then the prose and the
               log, then the menu — the frame read centre-first, top-down. Neither is
               aria-hidden: the enemy region manages its own, and a future <img alt> inside it
               must stay announced. Nothing inside either tag, not even whitespace. -->
          <div id="arena" class="arena"></div>
          <div id="vitals" class="vitals"></div>
          <!-- The reading column: a measure the narration is comfortable to read at, which is
               also the surface #13's prose gets written into. Every id below is unchanged —
               game.ts looks all of them up in `boot()`, and throws on a missing one. -->
          <div id="column" class="column">
            <h1 id="title">THE VOID</h1>
            <!-- Boot notices the player must not miss (an unlock store recovered from
                 backup, or lost). Empty by default; game.css collapses an empty one. -->
            <div id="notice" class="notice" role="status"></div>
            <!-- The floor's reserved region, mounted by the hub. ESTABLISHING POSITION: above
                 the prose, the way a visual novel reads — the image sets the place and the eye
                 never jumps back up past text. To move it to the FOOT of the column, move this
                 ONE line below #log and flip the order assertion in skeleton.test.ts. It is
                 deliberately NOT aria-hidden: the slot manages its own, and a future <img alt>
                 inside it must stay announced. -->
            <div id="scenery" class="scenery"></div>
            <div id="narration" class="narration" aria-live="polite"></div>
            <!-- The combat log (G18): the mechanical record of a fight, plain by default and
                 expandable to the dice. Empty outside battle, and collapsed when empty. -->
            <div id="log" class="log" aria-label="combat log"></div>
          </div>
          <!-- The choices: a region landmark, and AFTER the column in the DOM so the tab order
               follows the reading order — prose, then the log, then the things you can do.
               From 900px up it sits BESIDE the column rather than below it. -->
          <section id="choices" class="choices" aria-label="Choices"></section>
        </div>
      </section>
    </main>
    <!-- The entry script. `main.ts` calls `boot()` and nothing else (G51): the renderer module
         itself is inert on import. A file, not an inline script — the policy above allows none. -->
    <script type="module" src="/src/desktop/main.ts"></script>
  </body>
</html>
